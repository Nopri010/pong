[project]
name = "pongino"
version = "0.1.0"
description = "Jogo Pong distribuído com Arduino controlado por potenciômetros"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "tornado>=6.4",
    "pyserial>=3.5",
    "pydantic-settings>=2.2",
    "pyserial-asyncio>=0.6",
    "gpiozero>=2.0.1",
    "lgpio>=0.2.2.0; sys_platform == 'linux'",
]

[tool.uv]
package = true

[tool.setuptools.packages.find]
where = ["."]
include = ["pong*"]

[dependency-groups]
dev = [
    "basedpyright>=1.33.0",
    "pytest>=9.0",
    "pytest-asyncio>=1.0",
    "pytest-cov>=6.0",
    "ruff>=0.8.0",
    "taskipy>=1.14.0",
    "rich>=15.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "PLC0415"]
ignore = []

[tool.taskipy.tasks]
run = "python -m pong.cli.server"
cli = "python -m pong.cli.input_diagnostics"
test = "pytest --cov=pong --cov-branch --cov-report=term-missing --cov-report=xml --cov-fail-under=95"
lint = "ruff check ."
format = "ruff format ."
type-check = "basedpyright"

[tool.basedpyright]
include = ["pong"]
exclude = ["**/__pycache__", ".venv", ".pytest_cache", ".ruff_cache"]
allowedUntypedLibraries = ["serial_asyncio", "gpiozero"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
# O Tornado expõe uma sobrecarga parcialmente tipada para RequestHandler.finish.
# Não exigir cast apenas para esse tipo externo desconhecido.
reportUnknownMemberType = "none"

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["pong"]
branch = true

[tool.coverage.report]
fail_under = 95
precision = 2
show_missing = true
exclude_also = ["if __name__ == .__main__.:"]
